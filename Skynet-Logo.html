// Function to find the angle between two points
function angleBetweenDeg(x1, y1, x2, y2) {
    return Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
}

// Build a list of vertices from a chain of vector lengths and angles.
function buildChainVertices(startX, startY, lengths, anglesInDegrees) {
    let x = startX;
    let y = startY;
    const vertices = [{ x, y }];

    for (let i = 0; i < lengths.length; i++) {
        const angleRad = radians(anglesInDegrees[i]);
        x += cos(angleRad) * lengths[i];
        y += sin(angleRad) * lengths[i];
        vertices.push({ x, y });
    }

    return vertices;
}

function drawChainShape(startX, startY, lengths, anglesInDegrees) {
    const vertices = buildChainVertices(startX, startY, lengths, anglesInDegrees);

    beginShape();
    for (const p of vertices) {
        vertex(p.x, p.y);
    }
    endShape(CLOSE);
}

class Polygon {
    // Constructor for the object
    constructor(axPos, ayPos) {
        this.xPos = axPos;
        this.yPos = ayPos;
    }	
 
    display() {
        push(); 
        
        // Position the object
        translate(this.xPos, this.yPos);

        fill("#bc0000");
        stroke("#424242");
        strokeWeight(2);

        drawChainShape(0, 0, dists, angles);
        
        pop();
      }

    displayOutline() {
        push();
        translate(this.xPos, this.yPos);
        noFill();
        stroke("#424242");
        strokeWeight(2);
        drawChainShape(0, 0, dists, angles);
        pop();
    }
}
